name: TestPyPI Pre-Release Validation

# TestPyPI Trusted Publishing Setup:
# 1. Go to https://test.pypi.org/manage/account/publishing/
# 2. Add a new "pending publisher" with:
#    - PyPI Project Name: mapify-cli
#    - Owner: azalio (your GitHub username/org)
#    - Repository name: map-framework
#    - Workflow name: test-pypi.yml
#    - Environment name: (leave empty)
# 3. Once configured, this workflow will authenticate automatically via OIDC
# 4. No API tokens needed - GitHub Actions gets temporary credentials from TestPyPI
#
# Purpose: Validate release process before production PyPI deployment
# - Test package metadata rendering
# - Verify installation process
# - Catch packaging issues early
# - Safe environment for testing (TestPyPI is separate from production PyPI)

on:
  # Manual trigger for pre-release testing
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g., dev1, dev2, rc1) - appended to pyproject.toml version'
        required: false
        default: 'dev1'
        type: string
      skip_install_test:
        description: 'Skip installation verification test'
        required: false
        default: false
        type: boolean

  # Optional: Automatic testing on develop branch
  # Uncomment to enable continuous TestPyPI validation
  # push:
  #   branches:
  #     - develop

# Minimal permissions for OIDC trusted publishing
permissions:
  id-token: write  # Required for TestPyPI OIDC authentication
  contents: read   # Required for checkout in called ci.yml workflow

jobs:
  # First run all CI checks (tests, linters, build)
  ci:
    uses: ./.github/workflows/ci.yml

  # Publish to TestPyPI for pre-release validation
  publish-testpypi:
    needs: ci
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        BASE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
        if [ -z "$BASE_VERSION" ]; then
          echo "Error: Could not extract version from pyproject.toml"
          exit 1
        fi

        # Add version suffix for workflow_dispatch (manual trigger)
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION_SUFFIX="${{ inputs.version_suffix }}"
          TEST_VERSION="${BASE_VERSION}.${VERSION_SUFFIX}"
        else
          # For push events, use timestamp-based dev version
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          TEST_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
        fi

        echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
        echo "TEST_VERSION=$TEST_VERSION" >> $GITHUB_OUTPUT
        echo "Publishing test version: $TEST_VERSION (base: $BASE_VERSION)"

    - name: Update version for TestPyPI
      run: |
        # Temporarily modify pyproject.toml for TestPyPI upload
        TEST_VERSION="${{ steps.get_version.outputs.TEST_VERSION }}"
        sed -i.bak "s/^version = \".*\"/version = \"${TEST_VERSION}\"/" pyproject.toml
        echo "Updated pyproject.toml version to ${TEST_VERSION}"
        grep '^version = ' pyproject.toml

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build "packaging>=26" "twine>=6.2.0"

    - name: Build package
      run: |
        python -m build
        echo "Built packages:"
        ls -lh dist/

    - name: Verify package quality
      run: |
        python -m twine check dist/*
        echo "✓ Package validation passed"

    - name: Publish to TestPyPI using OIDC
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        print-hash: true

    - name: Wait for TestPyPI to process upload
      run: |
        echo "Waiting 30 seconds for TestPyPI to process the upload..."
        sleep 30

    - name: Verify package on TestPyPI
      run: |
        TEST_VERSION="${{ steps.get_version.outputs.TEST_VERSION }}"
        echo "Checking TestPyPI for mapify-cli version $TEST_VERSION"

        # Try to fetch package metadata from TestPyPI
        curl -f "https://test.pypi.org/pypi/mapify-cli/$TEST_VERSION/json" || {
          echo "Warning: Package not yet visible on TestPyPI (may take a few minutes)"
          echo "Check manually: https://test.pypi.org/project/mapify-cli/$TEST_VERSION/"
        }

    - name: Test installation from TestPyPI
      if: ${{ !inputs.skip_install_test }}
      run: |
        TEST_VERSION="${{ steps.get_version.outputs.TEST_VERSION }}"

        # Create clean test environment
        python -m venv .venv-testpypi
        source .venv-testpypi/bin/activate

        echo "Installing mapify-cli==$TEST_VERSION from TestPyPI..."
        # Install from TestPyPI, but allow dependencies from production PyPI
        pip install --index-url https://test.pypi.org/simple/ \
                    --extra-index-url https://pypi.org/simple/ \
                    "mapify-cli==$TEST_VERSION"

        echo "Verifying installation..."
        mapify --version
        mapify --help

        echo "✓ Installation test passed"
        deactivate

    - name: Cleanup test artifacts
      if: always()
      run: |
        # Restore original pyproject.toml
        if [ -f pyproject.toml.bak ]; then
          mv pyproject.toml.bak pyproject.toml
          echo "Restored original pyproject.toml"
        fi

        # Clean up test virtualenv
        rm -rf .venv-testpypi

    - name: Summary
      if: success()
      run: |
        TEST_VERSION="${{ steps.get_version.outputs.TEST_VERSION }}"
        echo "✅ TestPyPI validation successful!"
        echo ""
        echo "Package published: https://test.pypi.org/project/mapify-cli/$TEST_VERSION/"
        echo ""
        echo "Test installation command:"
        echo "  pip install --index-url https://test.pypi.org/simple/ \\"
        echo "              --extra-index-url https://pypi.org/simple/ \\"
        echo "              mapify-cli==$TEST_VERSION"
        echo ""
        echo "Next steps:"
        echo "1. Manually verify package metadata at the TestPyPI URL above"
        echo "2. Test installation in your local environment"
        echo "3. If everything looks good, proceed with production release"

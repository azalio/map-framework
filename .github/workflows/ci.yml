name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Validate version format
      run: |
        python3 << 'EOF'
        import tomllib
        import re
        import sys

        # Read version from pyproject.toml
        with open("pyproject.toml", "rb") as f:
            data = tomllib.load(f)

        version = data.get("project", {}).get("version")

        if not version:
            print("❌ ERROR: Could not find version in pyproject.toml")
            sys.exit(1)

        print(f"Found version: {version}")

        # Validate semver format
        # IMPORTANT: Must match regex in validate_semver() in scripts/bump-version.sh for consistency
        # Semver 2.0.0 spec: version numbers MUST NOT contain leading zeroes
        semver_pattern = r'^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

        if not re.match(semver_pattern, version):
            print(f"\n❌ ERROR: Invalid version format: {version}")
            print("\nExpected format: X.Y.Z (Semantic Versioning 2.0.0)")
            print("\nValid examples:")
            print("  ✅ 0.1.0")
            print("  ✅ 1.0.0")
            print("  ✅ 2.10.15")
            print("  ✅ 10.0.1")
            print("\nInvalid examples:")
            print("  ❌ 01.0.0  (leading zero in major)")
            print("  ❌ 1.02.0  (leading zero in minor)")
            print("  ❌ 1.0.03  (leading zero in patch)")
            print("  ❌ v1.0.0  (version prefix)")
            print("  ❌ 1.0     (incomplete version)")
            print("\nFix: Update version in pyproject.toml to valid semver format")
            sys.exit(1)

        print(f"✅ Version format valid: {version}")
        EOF

  test:
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # Skip Windows for now
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,ssl,dev]"

    - name: Run linters
      run: |
        # ruff/mypy/pyright are always installed via the [dev] extra above.
        # Each command must fail the step on error - do not swallow nonzero exits.
        ruff check src/ tests/
        mypy src/
        pyright src/

    - name: Install uv
      run: pip install uv

    - name: Render parity check
      run: make check-render

    - name: Run Codex provider regression checks
      run: |
        python -m pytest -v \
          tests/test_template_render.py::TestRenderRepoTreesCodex \
          tests/test_mapify_cli.py::TestCodexProvider

    - name: Run tests
      run: |
        python -m pytest -v -m "not slow" --cov=mapify_cli --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Check package
      run: |
        python -m pip install --upgrade "packaging>=26" "twine>=6.2.0"
        python -m twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ github.run_id }}
        path: dist/
        retention-days: 7

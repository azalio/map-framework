[project]
name = "mapify-cli"
version = "3.10.0"
description = "MAP Framework installer - Modular Agentic Planner for Claude Code"
authors = [{ name = "MAP Framework Contributors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1,<4",
    "platformdirs>=4.0.0",
    "readchar>=4.0.0",
    "questionary>=2.0.0"
]

[project.optional-dependencies]
ssl = ["truststore>=0.9.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pyyaml>=6.0.0",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pyyaml>=6.0.0",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "truststore>=0.9.0",
]

[project.scripts]
mapify = "mapify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/**/*.py",
    "src/mapify_cli/templates/**/*",
    "README.md",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mapify_cli"]

[tool.mypy]
ignore_missing_imports = false
exclude = [
    "src/mapify_cli/templates/map/scripts/",
]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/azalio/map-framework"
Repository = "https://github.com/azalio/map-framework.git"
Issues = "https://github.com/azalio/map-framework/issues"
